name: CI

# This project has no automated test suite yet (it's a personal
# WhatsApp bot verified primarily by hand against a real account -
# see docs/06_TROUBLESHOOTING.md for why real-API verification has
# mattered more here than unit tests so far). This workflow catches
# what it honestly can: syntax errors and basic lint issues, on every
# push and pull request.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check main.py compiles
        run: python -c "import ast; ast.parse(open('main.py').read())"

      - name: Install flake8
        run: pip install flake8

      - name: Lint (errors only - not enforcing style, just catching real bugs)
        run: flake8 main.py --select=E9,F63,F7,F82 --show-source
